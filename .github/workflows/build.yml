name: Build Dexter AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Generate Android Code
      run: |
        mkdir -p app/src/main/java/com/dexter/ai

        cat << 'EOF' > settings.gradle
        rootProject.name = "DexterAI"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.dexter.ai'
            compileSdk 34
            defaultConfig {
                applicationId "com.dexter.ai"
                minSdk 24
                targetSdk 34
                versionCode 2
                versionName "2.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.dexter.ai">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <application android:label="Dexter AI" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service android:name=".DexterNotificationService" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" android:exported="true">
                    <intent-filter><action android:name="android.service.notification.NotificationListenerService" /></intent-filter>
                </service>
                <service android:name=".FloatingBubbleService" android:enabled="true" android:exported="false" />
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/dexter/ai/MainActivity.java
        package com.dexter.ai;
        import android.app.Activity;
        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.graphics.Color;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.provider.Settings;
        import android.widget.*;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                SharedPreferences prefs = getSharedPreferences("DexterPrefs", MODE_PRIVATE);
                LinearLayout layout = new LinearLayout(this);
                layout.setOrientation(LinearLayout.VERTICAL);
                layout.setPadding(40, 60, 40, 60);
                layout.setBackgroundColor(Color.parseColor("#121212"));

                TextView title = new TextView(this);
                title.setText("Dexter AI Settings");
                title.setTextSize(24);
                title.setTextColor(Color.parseColor("#00E5FF"));
                layout.addView(title);

                EditText keyInput = new EditText(this);
                keyInput.setHint("Enter Gemini / Grok API Key");
                keyInput.setHintTextColor(Color.GRAY);
                keyInput.setTextColor(Color.WHITE);
                keyInput.setText(prefs.getString("api_key", ""));
                layout.addView(keyInput);

                Button saveBtn = new Button(this);
                saveBtn.setText("Save API Key");
                saveBtn.setOnClickListener(v -> {
                    prefs.edit().putString("api_key", keyInput.getText().toString().trim()).apply();
                    Toast.makeText(this, "Key Saved!", Toast.LENGTH_SHORT).show();
                });
                layout.addView(saveBtn);

                Button notifBtn = new Button(this);
                notifBtn.setText("1. Grant Notification Access");
                notifBtn.setOnClickListener(v -> startActivity(new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS")));
                layout.addView(notifBtn);

                Button overlayBtn = new Button(this);
                overlayBtn.setText("2. Grant Floating Bubble Access");
                overlayBtn.setOnClickListener(v -> {
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                        startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                    } else {
                        Toast.makeText(this, "Overlay Granted!", Toast.LENGTH_SHORT).show();
                    }
                });
                layout.addView(overlayBtn);

                Button bubbleBtn = new Button(this);
                bubbleBtn.setText("🚀 Launch Floating Bubble");
                bubbleBtn.setBackgroundColor(Color.parseColor("#00C853"));
                bubbleBtn.setOnClickListener(v -> {
                    startService(new Intent(this, FloatingBubbleService.class));
                    Toast.makeText(this, "Bubble Started!", Toast.LENGTH_SHORT).show();
                });
                layout.addView(bubbleBtn);

                ScrollView sv = new ScrollView(this);
                sv.addView(layout);
                setContentView(sv);
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/dexter/ai/DexterNotificationService.java
        package com.dexter.ai;
        import android.app.Notification;
        import android.content.SharedPreferences;
        import android.os.Bundle;
        import android.service.notification.NotificationListenerService;
        import android.service.notification.StatusBarNotification;
        import android.speech.tts.TextToSpeech;
        import java.io.*;
        import java.net.HttpURLConnection;
        import java.net.URL;
        import java.nio.charset.StandardCharsets;
        import java.util.Locale;
        import org.json.JSONArray;
        import org.json.JSONObject;

        public class DexterNotificationService extends NotificationListenerService implements TextToSpeech.OnInitListener {
            private TextToSpeech tts;
            @Override
            public void onCreate() {
                super.onCreate();
                tts = new TextToSpeech(this, this);
            }
            @Override
            public void onInit(int status) {
                if (status == TextToSpeech.SUCCESS) tts.setLanguage(Locale.US);
            }
            @Override
            public void onNotificationPosted(StatusBarNotification sbn) {
                String pkg = sbn.getPackageName();
                if (pkg == null || pkg.equals(getPackageName())) return;
                Notification n = sbn.getNotification();
                if (n == null || n.extras == null) return;
                Bundle b = n.extras;
                String title = b.getString(Notification.EXTRA_TITLE, "");
                CharSequence cs = b.getCharSequence(Notification.EXTRA_TEXT);
                String text = cs != null ? cs.toString() : "";
                if (!text.isEmpty()) analyze(title, text);
            }
            private void analyze(String title, String msg) {
                new Thread(() -> {
                    SharedPreferences p = getSharedPreferences("DexterPrefs", MODE_PRIVATE);
                    String key = p.getString("api_key", "");
                    if (key.isEmpty()) return;
                    try {
                        URL u = new URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + key);
                        HttpURLConnection c = (HttpURLConnection) u.openConnection();
                        c.setRequestMethod("POST");
                        c.setRequestProperty("Content-Type", "application/json");
                        c.setDoOutput(true);
                        String q = "Notification from " + title + ": '" + msg + "'. Is this important? Summarize in 1 sentence in Amharic.";
                        JSONObject body = new JSONObject().put("contents", new JSONArray().put(new JSONObject().put("parts", new JSONArray().put(new JSONObject().put("text", q)))));
                        try (OutputStream os = c.getOutputStream()) { os.write(body.toString().getBytes(StandardCharsets.UTF_8)); }
                        if (c.getResponseCode() == 200) {
                            BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), StandardCharsets.UTF_8));
                            StringBuilder sb = new StringBuilder();
                            String line;
                            while ((line = r.readLine()) != null) sb.append(line);
                            JSONObject res = new JSONObject(sb.toString());
                            String reply = res.getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text");
                            if (tts != null) tts.speak(reply, TextToSpeech.QUEUE_ADD, null, "d");
                        }
                    } catch (Exception e) {}
                }).start();
            }
            @Override
            public void onDestroy() {
                if (tts != null) { tts.stop(); tts.shutdown(); }
                super.onDestroy();
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/dexter/ai/FloatingBubbleService.java
        package com.dexter.ai;
        import android.app.Service;
        import android.content.Intent;
        import android.graphics.Color;
        import android.graphics.PixelFormat;
        import android.graphics.drawable.GradientDrawable;
        import android.os.Build;
        import android.os.IBinder;
        import android.view.Gravity;
        import android.view.MotionEvent;
        import android.view.View;
        import android.view.WindowManager;
        import android.widget.TextView;
        import android.widget.Toast;

        public class FloatingBubbleService extends Service {
            private WindowManager wm;
            private TextView v;
            @Override
            public IBinder onBind(Intent intent) { return null; }
            @Override
            public void onCreate() {
                super.onCreate();
                wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                v = new TextView(this);
                v.setText("🤖");
                v.setTextSize(30);
                v.setGravity(Gravity.CENTER);
                GradientDrawable g = new GradientDrawable();
                g.setShape(GradientDrawable.OVAL);
                g.setColor(Color.parseColor("#00E5FF"));
                v.setBackground(g);
                int t = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE;
                final WindowManager.LayoutParams p = new WindowManager.LayoutParams(160, 160, t, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                p.gravity = Gravity.TOP | Gravity.START;
                p.x = 100; p.y = 300;
                wm.addView(v, p);
                v.setOnTouchListener(new View.OnTouchListener() {
                    int ix, iy; float tx, ty;
                    public boolean onTouch(View view, MotionEvent e) {
                        switch (e.getAction()) {
                            case MotionEvent.ACTION_DOWN: ix = p.x; iy = p.y; tx = e.getRawX(); ty = e.getRawY(); return true;
                            case MotionEvent.ACTION_MOVE: p.x = ix + (int)(e.getRawX() - tx); p.y = iy + (int)(e.getRawY() - ty); wm.updateViewLayout(v, p); return true;
                            case MotionEvent.ACTION_UP:
                                if (Math.abs(e.getRawX() - tx) < 15) Toast.makeText(FloatingBubbleService.this, "Dexter Active!", Toast.LENGTH_SHORT).show();
                                return true;
                        }
                        return false;
                    }
                });
            }
            @Override
            public void onDestroy() {
                super.onDestroy();
                if (v != null) wm.removeView(v);
            }
        }
        EOF

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DexterAI-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
